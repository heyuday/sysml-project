[project]
name = "agentsql"
version = "0.1.0"
description = "Small benchmark for caching SQL results requested by concurrent LLM agents"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "openai>=3.46.0",
    "psycopg[binary]>=3.2",
    "tpchgen-cli>=4.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
