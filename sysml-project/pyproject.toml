[project]
name = "sysml-project"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["psycopg[binary,pool]>=3.2.4,<4", "redis>=5,<8", "pglast>=7,<8", "sqlglot>=30,<31", "fastapi>=0.115,<1", "uvicorn>=0.31,<1", "httpx>=0.27,<1"]

[project.scripts]
sysml = "sysml.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sysml"]
