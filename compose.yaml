name: agent-sql-bench  # fixed project name, independent of the folder name
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: shop
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - ./db/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d shop"]
      interval: 1s
      timeout: 3s
      retries: 30
